apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubequest-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/EpitechMscProPromo2026/T-CLO-902-PAR_9.git
    targetRevision: feat/kubernetes-project-Bilal
    path: kubernetes/kustomize/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
