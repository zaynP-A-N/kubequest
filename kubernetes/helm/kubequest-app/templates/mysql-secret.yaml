apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  mysql-database: {{ .Values.mysql.credentials.database }}
  mysql-user: {{ .Values.mysql.credentials.user }}
  mysql-password: {{ .Values.mysql.credentials.password }}
  mysql-root-password: {{ .Values.mysql.credentials.rootPassword }}
