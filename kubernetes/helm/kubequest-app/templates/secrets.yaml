# =============================================================================
# secrets.yaml — Secrets Helm (mysql-secret + app-secret)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  mysql-database: {{ .Values.mysql.credentials.database | quote }}
  mysql-user: {{ .Values.mysql.credentials.user | quote }}
  mysql-password: {{ .Values.mysql.credentials.password | quote }}
  mysql-root-password: {{ .Values.mysql.credentials.rootPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  # Valeur injectée depuis values-secrets.yaml
  app-key: {{ .Values.app.env.appKey | quote }}
