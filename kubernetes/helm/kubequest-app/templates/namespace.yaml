apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
    # PodSecurity : admission contrôle les pods de ce namespace
    # restricted → enforce les bonnes pratiques de sécurité (non-root, no privilege escalation...)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
