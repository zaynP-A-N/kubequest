---
# PVC pour stocker les backups MySQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-backup-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# CronJob qui fait le backup tous les jours à 2h du matin
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  schedule: "0 2 * * *"        # tous les jours à 2h00
  successfulJobsHistoryLimit: 3 # garde les 3 derniers jobs réussis
  failedJobsHistoryLimit: 1     # garde le dernier job échoué
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mysql-backup
              image: mysql:8.0
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: mysql-password
                - name: MYSQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: mysql-user
                - name: MYSQL_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: mysql-database
              command:
                - /bin/sh
                - -c
                - |
                  BACKUP_FILE="/backup/backup-$(date +%Y%m%d-%H%M%S).sql"
                  echo "Starting backup to $BACKUP_FILE"
                  mysqldump -h mysql -u $MYSQL_USER $MYSQL_DATABASE > $BACKUP_FILE
                  echo "Backup completed successfully"
                  # Supprime les backups de plus de 7 jours
                  find /backup -name "*.sql" -mtime +7 -delete
                  echo "Old backups cleaned up"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mysql-backup-pvc
