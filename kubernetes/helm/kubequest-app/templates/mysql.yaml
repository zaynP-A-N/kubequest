# =============================================================================
# mysql.yaml — PVC + Deployment + Service MySQL
# =============================================================================

# PersistentVolumeClaim — Demande du stockage persistant pour MySQL
# Satisfait par local-path-provisioner (StorageClass installée par init-master.sh)
# Sans PVC, les données MySQL sont perdues à chaque redémarrage du pod
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  accessModes:
    - ReadWriteOnce         # montable en écriture sur UN seul nœud à la fois
  storageClassName: {{ .Values.mysql.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.mysql.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ .Values.namespace }}
  labels:
    app: mysql
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.mysql.replicas }}   # toujours 1 : MySQL sans clustering
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        fsGroup: 999          # groupe mysql pour l'accès aux fichiers de données
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN        # MySQL a besoin de chown sur /var/lib/mysql
                - DAC_OVERRIDE
                - SETGID
                - SETUID
          args:
            - "--default-authentication-plugin=mysql_native_password"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          # ReadinessProbe — K8s attend que MySQL soit réellement prêt
          # avant d'envoyer du trafic (évite les erreurs "Connection refused")
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
# Service MySQL — accessible uniquement en interne (ClusterIP)
# DNS interne : mysql.<namespace>.svc.cluster.local
# Les pods Laravel utilisent simplement "mysql" comme DB_HOST
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Values.namespace }}
  labels:
    app: mysql
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
