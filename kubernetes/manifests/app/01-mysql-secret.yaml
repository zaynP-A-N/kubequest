# Secret contenant les credentials MySQL
# En prod : utiliser Vault ou Sealed Secrets (jamais de mots de passe en clair dans Git)
# Ici les valeurs sont encodées en base64 (ce n'est PAS du chiffrement)
#
# Pour encoder : echo -n "valeur" | base64
# app_database  → YXBwX2RhdGFiYXNl
# app_user      → YXBwX3VzZXI=
# REDACTED_DB_PASSWORD  → YXBwX3Bhc3N3b3Jk
# REDACTED_DB_ROOT_PASSWORD → YXBwX3Jvb3RfcGFzc3dvcmQ=
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: app
type: Opaque
data:
  mysql-database: YXBwX2RhdGFiYXNl        # app_database
  mysql-user: YXBwX3VzZXI=                # app_user
  mysql-password: YXBwX3Bhc3N3b3Jk        # REDACTED_DB_PASSWORD
  mysql-root-password: YXBwX3Jvb3RfcGFzc3dvcmQ=  # REDACTED_DB_ROOT_PASSWORD
