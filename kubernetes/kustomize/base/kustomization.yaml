apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - mysql-secret.yaml
  - app-secret.yaml
  - mysql.yaml
  - app.yaml
  - mysql-backup.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: kubequest
    includeSelectors: false
