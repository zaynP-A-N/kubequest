apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: app
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kubequest-app
type: Opaque
stringData:
  mysql-database: app_database
  mysql-user: app_user
  mysql-password: CHANGE_ME
  mysql-root-password: CHANGE_ME
