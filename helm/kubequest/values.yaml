# ============================================================
#  Default values for the kubequest chart.
#  Override any of these with --set key=value or -f myvalues.yaml
# ============================================================

# ---- Laravel application ----
app:
  image:
    repository: ciapro/kubequest-app
    tag: v1
    pullPolicy: IfNotPresent
  replicas: 1
  # schedule the app only on nodes labelled node-role=worker
  nodeSelector:
    node-role: worker
  # non-secret config -> rendered into the ConfigMap
  config:
    appName: "Laravel"
    appEnv: "dev"
    appDebug: "false"
    appUrl: "http://local.app"

# ---- Database connection (shared by Laravel + MySQL) ----
# Passwords removed — managed by SealedSecrets in templates/
db:
  connection: "mysql"
  host: "mysql"
  port: "3306"
  name: "laravel"
  user: "test"

# ---- MySQL server ----
mysql:
  image:
    repository: mysql
    tag: "8.0"
  nodeSelector:
    node-role: worker
  storage:
    size: 2Gi
    storageClassName: manual
    pvName: mysql-pv
    hostPath: /mnt/data/mysql

# ---- Ingress ----
ingress:
  enabled: true
  className: nginx
  host: local.app

# ---- Database migration Job (runs as a Helm hook) ----
migration:
  enabled: true
