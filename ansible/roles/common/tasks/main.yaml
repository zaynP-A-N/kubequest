---

- name: apt update
  ansible.builtin.apt:
    update_cache: yes
  become: yes

- name: install tools based
  ansible.builtin.apt:
    name: 
      - curl
      - vim
      - git
      - net-tools
    state: present
  become: yes

- name: off swap
  command: swapoff -a
  become: yes

- name: disable swap on fstab
  ansible.builtin.replace:
    path: /etc/fstab 
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'
  become: yes

- name: set overlay and br_netfilter modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  with_items:
    - overlay
    - br_netfilter
  become: yes

- name: sauvegarde modules
  ansible.builtin.copy: 
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/containerd.conf
  become: yes

- name: set sysctl params
  ansible.builtin.copy:
   content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
      net.bridge.bridge-nf-call-ip6tables = 1
   dest: /etc/sysctl.d/k8s.conf
  become: yes

- name: apply sysctl params
  command: sysctl --system
  become: yes
