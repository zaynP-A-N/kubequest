apiVersion: batch/v1
kind: Job
metadata:
  name: app-migration
  namespace: app
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role: worker
      containers:
        - name: migrate
          image: ciapro/kubequest-app:v1
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secret