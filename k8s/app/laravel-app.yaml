apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
      namespace: app
  template:
    metadata:
      labels:
        app: laravel-app
        namespace: app
    spec:
      nodeSelector:
        node-role: worker
      containers:
      - name: laravel-app
        image: ciapro/kubequest-app:v1
        envFrom:
        - configMapRef:
            name: laravel-config
        - secretRef:
            name: laravel-secret
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: laravel-app
  namespace: app
spec:
  selector:
    app: laravel-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP



        
